name: Validate Pagenary docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Run inside a node container so JS actions (checkout, upload-artifact) have
    # node on PATH. Without this, the Gitea host runner intermittently fails
    # with: exec: "node": executable file not found in $PATH.
    container:
      image: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (AIWG ci/digests.txt)
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # node 20 is provided by the container image above; no setup-node needed
      # (dropping it also removes the npm-cache-restore flakiness on this runner).

      - name: Install dependencies
        run: npm ci

      - name: List Pagenary tenants
        run: npm run list:tenants

      - name: Build ROKO KB
        run: npm run build:docs

      - name: Verify release gates
        run: npm run validate:release

      - name: Package validated Pagenary output
        run: |
          set -euo pipefail
          tar -czf roko-kb-pagenary-dist.tgz -C dist roko-kb
          sha256sum roko-kb-pagenary-dist.tgz > roko-kb-pagenary-dist.tgz.sha256

      - name: Upload validated docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: roko-kb-pagenary-dist
          path: |
            roko-kb-pagenary-dist.tgz
            roko-kb-pagenary-dist.tgz.sha256
