# Docs Deploy
#
# Builds the Pagenary `roko-kb` tenant, runs the release validation gates, and
# deploys the static output to the shared Caddy origin host, which fronts
# docs.roko.network via a Cloudflare tunnel.
#
# Mirrors the normalized static-docs auto-deploy pattern already used for
# docs.aiwg.io and docs.pagenary.com (CI -> rsync over SSH -> per-site :ro Caddy
# volume). Replaces the prior manual deploy (~/roko-docs/deploy.sh).
#
# Required repo secrets (Settings -> Actions -> Secrets):
#   DEPLOY_SSH_KEY  - private SSH key whose public half is in the deploy host's
#                     ~/.ssh/authorized_keys (key comment: deploy-roko-kb@ci)
#   DEPLOY_HOST     - deploy host, e.g. 66.94.104.191
#   DEPLOY_PORT     - SSH port, e.g. 2424
#   DEPLOY_USER     - SSH user, e.g. roctinam
#   DEPLOY_PATH     - target dir WITH trailing slash, e.g.
#                     /home/roctinam/production-deploy/roko-docs/
#
# No npm/registry token is required: all dependencies (incl.
# @pagenary/publisher) install anonymously from the public npm registry.

name: Docs Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy docs.roko.network
    runs-on: ubuntu-latest
    container:
      image: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5  # node 20.20.2 (AIWG ci/digests.txt)
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    # Deploy target — sourced from repo secrets so the host/path are not exposed
    # in the public GitHub mirror. The SSH key is mapped per-step below.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install dependencies
        run: npm ci

      - name: List Pagenary tenants
        run: npm run list:tenants

      - name: Build ROKO KB
        run: npm run build:docs

      - name: Verify release gates
        run: npm run validate:release

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d dist/roko-kb            || { echo "::error::Missing dist/roko-kb"; exit 1; }
          test -f dist/roko-kb/index.html || { echo "::error::Missing dist/roko-kb/index.html"; exit 1; }
          echo "Build verification passed"
          ls -lah dist/roko-kb/

      - name: Resolve deploy target
        run: |
          set -euo pipefail
          # Strip any whitespace/newlines from the secret values. A trailing
          # newline pasted into a secret makes ssh reject the host with
          # "hostname contains invalid characters". Trim defensively, then
          # re-export the clean values for the remaining steps.
          h="$(printf '%s' "${DEPLOY_HOST:-}" | tr -d '[:space:]')"
          p="$(printf '%s' "${DEPLOY_PORT:-}" | tr -d '[:space:]')"
          u="$(printf '%s' "${DEPLOY_USER:-}" | tr -d '[:space:]')"
          pa="$(printf '%s' "${DEPLOY_PATH:-}" | tr -d '[:space:]')"
          missing=()
          [ -n "$h" ]  || missing+=(DEPLOY_HOST)
          [ -n "$p" ]  || missing+=(DEPLOY_PORT)
          [ -n "$u" ]  || missing+=(DEPLOY_USER)
          [ -n "$pa" ] || missing+=(DEPLOY_PATH)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing deploy secret(s): ${missing[*]}"
            exit 1
          fi
          # Ensure the deploy path ends with a single trailing slash.
          case "$pa" in */) ;; *) pa="$pa/" ;; esac
          {
            echo "DEPLOY_HOST=$h"
            echo "DEPLOY_PORT=$p"
            echo "DEPLOY_USER=$u"
            echo "DEPLOY_PATH=$pa"
          } >> "$GITHUB_ENV"
          echo "Resolved deploy target: ${u}@${h}:${p} -> ${pa}"

      - name: Install SSH tools
        run: apt-get update && apt-get install -y --no-install-recommends openssh-client rsync

      - name: Configure SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is unset"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to docs origin
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=accept-new" \
            dist/roko-kb/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Verify deployment
        run: |
          set -euo pipefail
          # Content verification — file-presence alone leaves a silent failure
          # mode where rsync lands files in a path Caddy does not serve. Confirm
          # index.html is present and references ROKO.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -f '${DEPLOY_PATH}index.html' || { echo '::error::Deploy failed: ${DEPLOY_PATH}index.html missing'; exit 1; }
             grep -qi 'roko' '${DEPLOY_PATH}index.html' || { echo '::error::index.html present but does not reference ROKO — possible wrong content/path'; exit 1; }
             echo 'Deploy verified: index.html present and references ROKO.'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Log deployment result
        if: success()
        env:
          TRIGGER_EVENT: ${{ gitea.event_name }}
          TRIGGER_REF: ${{ gitea.ref }}
          TRIGGER_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          echo "Deployed docs.roko.network"
          echo "Trigger: ${TRIGGER_EVENT}"
          echo "Ref: ${TRIGGER_REF}"
          echo "Commit: ${TRIGGER_SHA}"
